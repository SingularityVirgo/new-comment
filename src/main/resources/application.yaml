server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      # 秒杀等短请求易占满默认 200 线程；按单机 Redis 吞吐适度放大
      max: 400
      min-spare: 32
spring:
  application:
    name: virgo
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/comment?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 123456

  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      port: 6379
      host: localhost
      password: 123456
      lettuce:
        pool:
          # 原 8 过小：鉴权 + RedisIdWorker + Lua 单次秒杀至少 3 次 Redis，易在池上排队
          max-active: 128
          max-idle: 64
          min-idle: 16
          max-wait: 2s
        shutdown-timeout: 100ms
mybatis-plus:
  type-aliases-package: com.virgo.domain.po

# 阿里云 OSS（必选）：在环境变量或下方配置 AccessKey、Bucket、公网访问根 URL；缺项时启动失败。
#
# —— Windows 环境变量（改完后须重启 IDE / 进程）——
# Win + R → sysdm.cpl →「高级」→「环境变量」；或 PowerShell： setx ALIYUN_OSS_ACCESS_KEY_ID "你的AccessKeyId"
#
# public-base-url 须与浏览器访问域名一致（含自定义 CDN）；上传默认写 public-read，若 Bucket 禁止 ACL 请设 ALIYUN_OSS_UPLOAD_PUBLIC_READ=false 并在 OSS 控制台配置匿名读策略。
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:mzy-comment}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:https://mzy-comment.oss-cn-beijing.aliyuncs.com}
    upload-public-read: ${ALIYUN_OSS_UPLOAD_PUBLIC_READ:true}

logging:
  level:
    com.virgo: debug

app:
  admin:
    # 运营后台发券接口请求头 X-Admin-Token；生产请用环境变量覆盖
    api-token: ${ADMIN_API_TOKEN:dev-admin-token}
  seckill:
    # 距 begin_time 提前多少分钟内把库存从 DB 预热进 Redis
    preheat-lead-minutes: ${SECKILL_PREHEAT_LEAD_MINUTES:5}
