server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: virgo
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/comment?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 123456

  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      port: 6379
      host: localhost
      password: 123456
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms
mybatis-plus:
  type-aliases-package: com.virgo.domain.po

# 阿里云 OSS（笔记图片、用户头像 uploads/avatars/）。AccessKey 不要写在本文件：在系统 / IDE 运行配置 / Docker 中设置环境变量即可，
# Spring 会按前缀绑定到 aliyun.oss（与 OssProperties 字段对应）：
#   ALIYUN_OSS_ACCESS_KEY_ID、ALIYUN_OSS_ACCESS_KEY_SECRET
# 启用 OSS（PowerShell 示例）:
#   $env:ALIYUN_OSS_ENABLED="true"
#   $env:ALIYUN_OSS_ACCESS_KEY_ID="..."
#   $env:ALIYUN_OSS_ACCESS_KEY_SECRET="..."
aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:mzy-comment}
    # 对外访问根地址，无尾部斜杠；未绑自定义域名时用 Bucket 外网域名即可
    public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:https://mzy-comment.oss-cn-beijing.aliyuncs.com}

logging:
  level:
    com.virgo: debug

app:
  admin:
    # 运营后台发券接口请求头 X-Admin-Token；生产请用环境变量覆盖
    api-token: ${ADMIN_API_TOKEN:dev-admin-token}
  seckill:
    # 距 begin_time 提前多少分钟内把库存从 DB 预热进 Redis
    preheat-lead-minutes: ${SECKILL_PREHEAT_LEAD_MINUTES:5}
